<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="build-flow"><rect width="1000" height="300" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">From Dockerfile to running container</text><rect x="20" y="110" width="160" height="80" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="100.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">Dockerfile</text><text x="100.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">+ build context</text><rect x="216" y="110" width="160" height="80" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="296.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">docker build</text><text x="296.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">cache per step</text><defs><marker id="a8" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="182" y1="150" x2="214" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a8)"/><rect x="412" y="110" width="160" height="80" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="492.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">Image</text><text x="492.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">name:tag · digest</text><defs><marker id="a13" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="378" y1="150" x2="410" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a13)"/><rect x="608" y="110" width="160" height="80" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="688.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">Registry</text><text x="688.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">push / pull</text><defs><marker id="a18" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="574" y1="150" x2="606" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a18)"/><rect x="804" y="110" width="160" height="80" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="884.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">Container</text><text x="884.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">docker run</text><defs><marker id="a23" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="770" y1="150" x2="802" y2="150" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a23)"/><text x="500" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">.dockerignore keeps secrets and junk out of the context · tags move, digests do not</text></svg>
