<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="storage"><rect width="1000" height="360" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Where container data lives</text><rect x="40" y="80" width="280" height="90" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="2"/><text x="180.0" y="119.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">writable layer</text><text x="180.0" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">dies with the container</text><rect x="360" y="80" width="280" height="90" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="500.0" y="119.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">named volume</text><text x="500.0" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">managed by Docker · survives</text><rect x="680" y="80" width="280" height="90" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="820.0" y="119.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">bind mount</text><text x="820.0" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">a host folder · you manage it</text><text x="180" y="205" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">(nothing to add)</text><text x="500" y="205" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">-v pgdata:/var/lib/postgresql</text><text x="820" y="205" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">-v "$(pwd)":/app</text><text x="180" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">temporary files only</text><text x="500" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">databases, uploads</text><text x="820" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle" xml:space="preserve">source code in development</text><rect x="360" y="275" width="280" height="55" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="500.0" y="296.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">tmpfs</text><text x="500.0" y="317.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">in memory · for --read-only</text></svg>
