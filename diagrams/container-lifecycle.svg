<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="container-lifecycle"><rect width="1000" height="330" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Container lifecycle</text><rect x="60" y="130" width="160" height="70" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="140.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">created</text><rect x="290" y="130" width="160" height="70" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="370.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">running</text><rect x="520" y="130" width="160" height="70" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="600.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">exited</text><rect x="780" y="130" width="160" height="70" rx="10" fill="#5b647214" stroke="#5b6472" stroke-width="2"/><text x="860.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="middle" xml:space="preserve">removed</text><defs><marker id="a10" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="222" y1="165" x2="288" y2="165" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a10)"/><text x="255.0" y="156.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">start</text><de