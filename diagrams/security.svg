<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="security"><rect width="1000" height="380" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Container hardening, layer by layer</text><rect x="40" y="80" width="290" height="100" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="185.0" y="124.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">minimal, pinned base</text><text x="185.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">fewer packages, fewer CVEs</text><rect x="355" y="80" width="290" height="100" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="500.0" y="124.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">non-root USER</text><text x="500.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">not uid 0</text><rect x="670" y="80" width="290" height="100" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="815.0" y="124.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">read-only root file system</text><text x="815.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">+ tmpfs where needed</text><rect x="40" y="210" width="290" height="100" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="185.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">cap_drop: ALL</text><text x="185.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">add back only what is needed</text><rect x="355" y="210" width="290" height="100" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2"/><text x="500.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">no-new-privileges</text><text x="500.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">no setuid escalation</text><rect x="670" y="210" width="290" height="100" rx="10" fill="#dc262614" stroke="#dc2626" stroke-width="2"/><text x="815.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" xml:space="preserve">memory · CPU · pids limits</text><text x="815.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">one container cannot starve the host</text><text x="500" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">secrets as files at run time, never in ENV, ARG or a layer · never mount docker.sock</text></svg>
