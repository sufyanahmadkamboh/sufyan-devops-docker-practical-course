<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="multistage"><rect width="1000" height="330" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Multi-stage build: compile big, ship small</text><rect x="30" y="70" width="430" height="220" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7 5"/><text x="42" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="start" xml:space="preserve">stage build: golang:1.26-alpine</text><rect x="60" y="110" width="170" height="60" rx="10" fill="#5b647214" stroke="#5b6472" stroke-width="2"/><text x="145.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="middle" xml:space="preserve">Go toolchain</text><rect x="250" y="110" width="180" height="60" rx="10" fill="#5b647214" stroke="#5b6472" stroke-width="2"/><text x="340.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="middle" xml:space="preserve">source + modules</text><rect x="150" y="200" width="200" height="60" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="250.0" y="224.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">/out/api</text><text x="250.0" y="245.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">static binary</text><rect x="560" y="70" width="410" height="220" rx="12" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="7 5"/><text x="572" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start" xml:space="preserve">final: distroless static, nonroot</text><rect x="660" y="150" width="200" height="60" rx="10" fill="#16a34a14" stroke="#16a34a" stroke-width="2"/><text x="760.0" y="174.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle" xml:space="preserve">/api</text><text x="760.0" y="195.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">only this is shipped</text><defs><marker id="a16" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="352" y1="230" x2="658" y2="182" stroke="#5b6472" stroke-width="2.2" marker-end="url(#a16)"/><text x="505.0" y="197.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">COPY --from=build</text><text x="500" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">lesson 091 measures the difference on real images</text></svg>
