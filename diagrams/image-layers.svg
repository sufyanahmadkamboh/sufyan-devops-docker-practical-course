<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-label="image-layers"><rect width="1000" height="390" rx="14" fill="#ffffff"/><text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start" xml:space="preserve">Images are layers; a container adds one writable layer</text><rect x="60" y="80" width="380" height="44" rx="10" fill="#1d63ed14" stroke="#1d63ed" stroke-width="2"/><text x="250.0" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d63ed" text-anchor="middle" xml:space="preserve">COPY . .</text><rect x="60" y="132" width="380" height="44" rx="10" fill="#7c3aed14" stroke="#7c3aed" stroke-width="2"/><text x="250.0" y="159.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle" xml:space="preserve">RUN npm ci</text><rect x="60" y="184" width="380" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="250.0" y="211.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">COPY package*.json ./</text><rect x="60" y="236" width="380" height="44" rx="10" fill="#0d948814" stroke="#0d9488" stroke-width="2"/><text x="250.0" y="263.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle" xml:space="preserve">WORKDIR /app</text><rect x="60" y="288" width="380" height="44" rx="10" fill="#5b647214" stroke="#5b6472" stroke-width="2"/><text x="250.0" y="315.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="middle" xml:space="preserve">FROM node:24-alpine</text><text x="250" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">read-only · shared by every container of the image</text><rect x="540" y="80" width="190" height="60" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2" stroke-dasharray="7 5"/><text x="635.0" y="104.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">writable layer</text><text x="635.0" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">container 1</text><defs><marker id="a16" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="635" y1="142" x2="442" y2="104" stroke="#5b6472" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a16)"/><rect x="760" y="80" width="190" height="60" rx="10" fill="#ea7a0c14" stroke="#ea7a0c" stroke-width="2" stroke-dasharray="7 5"/><text x="855.0" y="104.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ea7a0c" text-anchor="middle" xml:space="preserve">writable layer</text><text x="855.0" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle" xml:space="preserve">container 2</text><defs><marker id="a21" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs><line x1="855" y1="142" x2="442" y2="134" stroke="#5b6472" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a21)"/><text x="560" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start" xml:space="preserve">the writable layer is deleted with the container:</text><text x="560" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start" xml:space="preserve">keep data in volumes (lesson 055)</text></svg>
