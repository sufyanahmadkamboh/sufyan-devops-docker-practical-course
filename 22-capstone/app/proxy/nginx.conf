# The reverse proxy: the only container with a published port.
#   /api/  → the API          (network "edge")
#   /      → the frontend     (network "edge")
# Docker's embedded DNS (127.0.0.11) resolves the service names; resolving at request time (variables in
# proxy_pass) lets the proxy start, and recover, even while a backend is restarting.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s upstream=$upstream_addr';
  access_log /dev/stdout main;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 16k;

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }
    location /api/ {
      set $api http://api:8080;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 10s;
    }
    location / {
      set $frontend http://frontend:8080;
      proxy_pass $frontend;
      proxy_set_header Host $host;
    }
  }
}
