# The Kubernetes version of: docker run -d --name go-api -e PORT=8080 --memory 64m --cpus 0.25 go-api:1.0 (two copies)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  labels:
    app: go-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
        - name: go-api
          image: go-api:1.0              # loaded into the cluster with: kind load docker-image go-api:1.0
          ports:
            - containerPort: 8080        # like EXPOSE: documents the port the app listens on
          env:
            - name: PORT                 # like -e PORT=8080
              value: "8080"
          resources:
            limits:                      # like --memory 64m --cpus 0.25
              memory: 64Mi
              cpu: 250m
          readinessProbe:                # like HEALTHCHECK: traffic only goes to ready Pods
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
