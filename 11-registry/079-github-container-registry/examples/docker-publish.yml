# .github/workflows/docker-publish.yml: build the image and push it to GHCR on every tag v*
name: docker-publish
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # lets GITHUB_TOKEN push to ghcr.io/OWNER/*
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cafe-api:${GITHUB_REF_NAME#v}
          docker build -t "$image" .
          docker push "$image"
