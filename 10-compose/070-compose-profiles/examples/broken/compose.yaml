services:
  api:
    build: .
    ports:
      - "8080:5000"
    environment:
      REDIS_HOST: redis
    depends_on: [seed]        # "the API needs test data", someone thought
  redis:
    image: redis:8-alpine
  seed:
    image: redis:8-alpine
    profiles: [seed]
    command: redis-cli -h redis SET visits 100
