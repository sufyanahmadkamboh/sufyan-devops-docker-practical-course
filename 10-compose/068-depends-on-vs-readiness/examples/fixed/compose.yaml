services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: example-password-change-me   # a practice value, never a real password
    healthcheck:               # "ready" = PostgreSQL accepts connections
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 15
  migrate:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy   # wait until db's healthcheck passes
    environment:
      PGPASSWORD: example-password-change-me
    command: psql -h db -U postgres -c "SELECT 'schema ready' AS status"
