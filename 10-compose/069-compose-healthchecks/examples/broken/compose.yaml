services:
  api:
    build: .
    ports:
      - "8080:5000"
    environment:
      REDIS_HOST: redis
    healthcheck:
      # the image has no curl: ask the API's /health endpoint with Python itself
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)"]
      interval: 5s        # run the check every 5 seconds
      timeout: 3s         # a check that takes longer counts as failed
      retries: 3          # unhealthy after 3 failures in a row
      start_period: 5s    # failures during start-up do not count yet
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]   # healthy only if Redis answers PONG
      interval: 2s
      timeout: 2s
      retries: 10
