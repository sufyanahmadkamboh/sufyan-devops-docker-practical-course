# Static files, and /api/ forwarded to the API service (resolved by Docker's DNS at request time).
server {
  listen 8080;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
  }
}
