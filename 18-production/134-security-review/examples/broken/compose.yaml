# The first hardening attempt (lesson 134): read-only, but Nginx has nowhere to write
services:
  web:
    image: nginx:1.30-alpine
    ports:
      - "8080:80"                       # the only published port
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 64M }

  api:
    build: .
    image: review-api:after
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  db:
    image: postgres:18-alpine           # no published port: only the stack's network reaches it
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
