# The deployment under review (lesson 134)
services:
  api:
    build: .
    image: review-api:before
    ports:
      - "3000:3000"
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: example-password-change-me
